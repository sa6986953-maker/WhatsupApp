
name: Build Whatsup APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find and Extract ZIP
        shell: bash
        run: |
          mkdir -p project

          mapfile -t ZIP_FILES < <(
            find . -type f -iname "*.zip" \
            ! -path "./.git/*"
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Exactly one ZIP file is required."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          unzip -q "${ZIP_FILES[0]}" -d project

          if [ ! -f project/settings.gradle.kts ] && \
             [ ! -f project/settings.gradle ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

      - name: Fix Missing Environment File
        run: |
          touch project/.env.example
          echo "Environment file checked:"
          ls -la project/.env.example

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore project/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Whatsup APK
        run: |
          gradle -p project \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          find project/app/build/outputs/apk \
            -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatsup-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
